; --- EOS lobby + P2P listen server (task 15, choomfie-library/ref/eos-ue5.md).
; The Artifact (ClientId/Secret/ProductId/SandboxId/DeploymentId/encryption key) is
; added by Kevin in Project Settings -> Epic Online Services; keep the secret out of git.
; NULL until the Artifact IDs are set: with EOS selected and no IDs, every PIE/commandlet/package run
; logs EOS PlatformCreate errors (and UnrealEditor-Cmd exits 1). See README "Online (EOS)".
; Switch to EOS in the same commit/build that adds the Artifact (test_setup_content enforces this).
[OnlineSubsystem]
DefaultPlatformService=NULL
